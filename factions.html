<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACTIONS: WAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0c0e;
    --ink-2:#15171a;
    --panel:#1c1e22;
    --paper:#e9dfc4;
    --paper-dim:#b8ad8e;
    --gold:#c9a227;
    --gold-bright:#f2d264;
    --blood:#8a2222;
    --blood-bright:#d23a3a;
    --line:#3c3527;
    --shadow: 0 10px 30px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #2a2419 0%, var(--ink) 55%, #050505 100%);
    color:var(--paper);
    font-family:'Crimson Text', Georgia, serif;
    min-height:100vh;
    padding:18px 14px 60px;
  }
  #app{max-width:1180px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  header h1{
    font-family:'Cinzel', Georgia, serif;
    font-weight:700;
    letter-spacing:.12em;
    font-size:clamp(28px,4vw,44px);
    margin:0 0 4px;
    color:var(--gold-bright);
    text-shadow:0 2px 14px rgba(201,162,39,.25);
  }
  header .sub{
    font-style:italic;
    color:var(--paper-dim);
    font-size:15px;
    letter-spacing:.04em;
  }

  /* ---------- Scoreboard ---------- */
  #scoreboard{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin:14px 0 20px;
  }
  .score-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    min-width:120px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .score-card .seat-name{
    font-family:'Cinzel', Georgia, serif;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--paper-dim);
    text-transform:uppercase;
  }
  .pips{display:flex;justify-content:center;gap:5px;margin-top:6px;}
  .pip{
    width:11px;height:11px;border-radius:50%;
    border:1px solid var(--gold);
    background:transparent;
    transition:background .3s, box-shadow .3s;
  }
  .pip.filled{
    background:var(--gold-bright);
    box-shadow:0 0 8px var(--gold-bright);
  }
  .score-card.leader{outline:1px solid var(--gold-bright);}

  /* ---------- Table ---------- */
  #table-wrap{
    position:relative;
    max-width:880px;
    margin:0 auto;
    aspect-ratio:4/3.1;
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    background:#0e3322;
    cursor:default;
  }
  #table-wrap.skippable{cursor:pointer;}
  #table-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:brightness(.8) saturate(.85);
  }
  #table-wrap.no-table-art{
    background:
      radial-gradient(ellipse at center, #154430 0%, #0c2a1c 70%, #061a11 100%);
  }
  #table-wrap.no-table-art::before{
    content:"";
    position:absolute; inset:14px;
    border:2px solid rgba(201,162,39,.35);
    border-radius:50%;
  }

  .table-grid{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-areas:
      ".    north  ."
      "west center east"
      ".    south  .";
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: auto 1fr auto;
    height:100%;
    padding:10px;
    gap:6px;
  }
  .seat{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .seat-north{grid-area:north;}
  .seat-east{grid-area:east; flex-direction:column;}
  .seat-south{grid-area:south;}
  .seat-west{grid-area:west;}
  .seat-label{
    font-family:'Cinzel', Georgia, serif;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--paper-dim);
    text-transform:uppercase;
    background:rgba(11,12,14,.55);
    padding:2px 8px;
    border-radius:10px;
  }
  .seat.winning .seat-label{color:var(--gold-bright); background:rgba(201,162,39,.18);}
  .hand-row{display:flex; gap:5px;}

  .center{
    grid-area:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #caption-bar{
    text-align:center;
    max-width:380px;
    padding:10px 16px;
    background:rgba(8,9,10,.72);
    border:1px solid rgba(201,162,39,.35);
    border-radius:10px;
    opacity:0;
    transition:opacity .35s ease;
    min-height:54px;
  }
  #caption-bar.show{opacity:1;}
  #caption-bar .eyebrow{
    font-family:'Cinzel', Georgia, serif;
    font-size:10px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  #caption-bar .line{
    font-style:italic;
    font-size:14.5px;
    color:var(--paper);
    line-height:1.35;
  }
  #skip-hint{
    font-size:10px;
    color:var(--paper-dim);
    margin-top:6px;
    opacity:.8;
  }

  .card-slot{
    width:54px; height:78px;
    border-radius:5px;
    background:#d9cfae;
    border:1px solid #00000040;
    box-shadow:0 3px 8px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
    transition:transform .25s, box-shadow .25s, filter .25s, opacity .25s;
  }
  .card-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-fallback{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Cinzel', Georgia, serif;
    color:#26201a;
    background:linear-gradient(160deg,#efe6cb,#cdc0a0);
  }
  .card-fallback .r{font-size:18px;font-weight:700;}
  .card-fallback .s{font-size:14px;}
  .card-fallback.red{color:#7a1f1f;}

  .card-slot.glow-intense{
    box-shadow:0 0 0 2px var(--gold-bright), 0 0 18px 4px rgba(242,210,100,.85);
    transform:translateY(-4px) scale(1.06);
    z-index:3;
  }
  .card-slot.card-flash-red{
    box-shadow:0 0 0 2px var(--blood-bright), 0 0 16px 4px rgba(210,58,58,.85);
    filter:grayscale(.4) brightness(.7);
  }
  .card-slot.card-disabled{
    filter:grayscale(.85) brightness(.55);
    box-shadow:0 0 0 2px rgba(138,34,34,.7);
  }
  .card-slot.card-blocked{
    box-shadow:0 0 0 2px #6fb7c9, 0 0 14px 3px rgba(111,183,201,.7);
  }
  .seat.winning .card-slot{box-shadow:0 0 0 2px var(--gold-bright), 0 0 10px 2px rgba(242,210,100,.5);}

  @media (prefers-reduced-motion: reduce){
    .card-slot{transition:none;}
    #caption-bar{transition:none;}
  }

  /* ---------- Controls ---------- */
  #controls{
    display:flex; justify-content:center; margin-top:18px; gap:12px; flex-wrap:wrap;
  }
  button{
    font-family:'Cinzel', Georgia, serif;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-size:13px;
    background:var(--gold);
    color:#1a1505;
    border:none;
    padding:10px 22px;
    border-radius:6px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .2s, transform .1s;
  }
  button:hover{background:var(--gold-bright);}
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--paper); outline-offset:2px;}
  button:disabled{opacity:.5; cursor:default;}

  /* ---------- Cheat panel ---------- */
  #cheat-panel{
    position:fixed;
    right:14px; bottom:14px;
    width:280px;
    max-height:70vh;
    background:rgba(15,17,20,.95);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    z-index:50;
    font-size:12.5px;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  #cheat-panel.collapsed{max-height:38px;}
  #cheat-toggle{
    width:100%;
    background:var(--panel);
    border:none;
    color:var(--gold-bright);
    font-family:'Cinzel', Georgia, serif;
    font-size:11px;
    letter-spacing:.08em;
    padding:10px 12px;
    text-align:left;
    cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
  }
  #cheat-body{
    padding:6px 10px 12px;
    max-height:calc(70vh - 38px);
    overflow-y:auto;
  }
  .tier-block{margin-top:8px;}
  .tier-title{
    color:var(--gold);
    font-family:'Cinzel', Georgia, serif;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
    padding-bottom:3px;
    margin-bottom:4px;
  }
  .cheat-row{
    display:flex; gap:6px; padding:3px 4px; border-radius:4px;
    transition:background .25s, box-shadow .25s;
  }
  .cheat-row .suit-mark{width:16px; flex:0 0 auto; text-align:center;}
  .cheat-row .body b{color:var(--paper);}
  .cheat-row .body{color:var(--paper-dim); line-height:1.25;}
  .cheat-row.spade .suit-mark, .cheat-row.club .suit-mark{color:#cfcfcf;}
  .cheat-row.diamond .suit-mark, .cheat-row.heart .suit-mark{color:var(--blood-bright);}
  .cheat-row.active{
    background:rgba(201,162,39,.18);
    box-shadow:inset 0 0 0 1px var(--gold);
  }

  /* ---------- Banner ---------- */
  #winner-banner{
    position:fixed; inset:0;
    background:rgba(5,5,6,.86);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  #winner-banner[hidden]{
    display:none;
  }
  #winner-banner .box{
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:12px;
    padding:34px 40px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  #winner-banner h2{
    font-family:'Cinzel', Georgia, serif;
    color:var(--gold-bright);
    letter-spacing:.1em;
    margin:0 0 6px;
  }
  #winner-banner p{color:var(--paper-dim); margin:0 0 18px;}

  footer.note{
    text-align:center;
    color:var(--paper-dim);
    font-size:11px;
    margin-top:26px;
    opacity:.6;
  }

  @media (max-width:560px){
    .card-slot{width:38px; height:56px;}
    #cheat-panel{width:84vw; right:8vw;}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>FACTIONS: WAR</h1>
    <div class="sub">French Quarter &middot; May 3, 1946</div>
  </header>

  <div id="scoreboard"></div>

  <div id="table-wrap">
    <img id="table-bg" src="table.webp" alt=""
         onerror="this.style.display='none'; document.getElementById('table-wrap').classList.add('no-table-art')">
    <div class="table-grid">
      <div class="seat seat-north" data-seat="0">
        <div class="seat-label">Seat 1</div>
        <div class="hand-row" data-hand="0"></div>
      </div>
      <div class="seat seat-west" data-seat="3">
        <div class="seat-label">Seat 4</div>
        <div class="hand-row" data-hand="3"></div>
      </div>
      <div class="center">
        <div id="caption-bar">
          <div class="eyebrow" id="caption-eyebrow">&nbsp;</div>
          <div class="line" id="caption-line">Deal the round to begin.</div>
          <div id="skip-hint" hidden>Click the table to skip ahead</div>
        </div>
      </div>
      <div class="seat seat-east" data-seat="1">
        <div class="seat-label">Seat 2</div>
        <div class="hand-row" data-hand="1"></div>
      </div>
      <div class="seat seat-south" data-seat="2">
        <div class="seat-label">Seat 3</div>
        <div class="hand-row" data-hand="2"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="play-btn">Deal Round</button>
  </div>

  <footer class="note">Resolution order: Tire Iron &rarr; Aces &rarr; Kings &rarr; Queens &rarr; Jacks. Best of 7 &middot; first to 4 round wins takes the match.</footer>
</div>

<div id="cheat-panel" class="collapsed">
  <button id="cheat-toggle">
    <span>ROYAL CHEAT SHEET</span>
    <span id="cheat-arrow">&#9650;</span>
  </button>
  <div id="cheat-body"></div>
</div>

<div id="winner-banner" hidden>
  <div class="box">
    <h2 id="banner-title">SEAT 1 WINS THE MATCH</h2>
    <p>First to four round wins takes it.</p>
    <button id="new-match-btn">New Match</button>
  </div>
</div>

<script>
/* ===================================================================
   FACTIONS: WAR — engine logic ported verbatim from factions_engine_v2.js
   (validated, 20,000+ rounds, zero crashes). Only addition here is
   `yield` instrumentation for step-by-step animation — no rule changes.
   =================================================================== */

const SUITS = ['♠','♦','♣','♥'];
const FLESH_RANKS = [2,3,4,5,6,7,8,9,10];
const IRON_RANKS = ['J','Q','K','A'];

function buildDeck() {
  const deck = [];
  for (const s of SUITS) {
    for (const r of FLESH_RANKS) deck.push({ rank: r, suit: s, isIron: false });
    for (const r of IRON_RANKS) deck.push({ rank: r, suit: s, isIron: true });
  }
  return deck;
}
function shuffle(deck) {
  const d = deck.slice();
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function dealHands(deck, numPlayers, handSize) {
  const hands = [];
  let idx = 0;
  for (let p = 0; p < numPlayers; p++) { hands.push(deck.slice(idx, idx + handSize)); idx += handSize; }
  return hands;
}
function rankValue(card) {
  if (!card.isIron) return card.rank;
  return { 'J': 11, 'Q': 12, 'K': 13, 'A': 14 }[card.rank];
}
function weakestIdx(hand) {
  let idx = 0;
  for (let i = 1; i < hand.length; i++) if (rankValue(hand[i]) < rankValue(hand[idx])) idx = i;
  return idx;
}
function strongestIdx(hand) {
  let idx = 0;
  for (let i = 1; i < hand.length; i++) if (rankValue(hand[i]) > rankValue(hand[idx])) idx = i;
  return idx;
}
function findCard(hand, rank, suit) {
  return hand.findIndex(c => c.rank === rank && c.suit === suit);
}
function hasUnused(hand, rank, suit) {
  return hand.some(c => c.rank === rank && c.suit === suit && !c._used);
}
function markUsed(hand, rank, suit) {
  const c = hand.find(x => x.rank === rank && x.suit === suit);
  if (c) c._used = true;
}
function draw(deck, drawIdx, n) {
  const out = deck.slice(drawIdx.i, drawIdx.i + n);
  drawIdx.i += n;
  return out;
}
function checkSupersede(hands, targetIdx, deck, drawIdx) {
  const hand = hands[targetIdx];
  if (hasUnused(hand, 'K', '♠')) {
    hand.push(...draw(deck, drawIdx, 1));
    markUsed(hand, 'K', '♠');
    return true;
  }
  return false;
}
function safeDiscard(hands, targetIdx, cardIdx) {
  if (hands[targetIdx]._safeHouse) return false;
  hands[targetIdx].splice(cardIdx, 1);
  return true;
}
function evaluateHand(hand) {
  if (!hand.length) return { tier: 0, tieRank: 0, suitTie: -1 };
  const suit0 = hand[0].suit;
  const isFlush = hand.length === 4 && hand.every(c => c.suit === suit0);
  const fleshCards = hand.filter(c => !c.isIron);
  const rankCounts = {};
  for (const c of fleshCards) rankCounts[c.rank] = (rankCounts[c.rank] || 0) + 1;
  const counts = Object.entries(rankCounts).sort((a, b) => b[1] - a[1]);
  const hasTrips = counts.length && counts[0][1] >= 3;
  const hasPair = counts.length && counts[0][1] >= 2;

  let tier, tieRank;
  if (isFlush)       { tier = 4; tieRank = Math.max(...hand.map(rankValue)); }
  else if (hasTrips) { tier = 3; tieRank = Number(counts[0][0]); }
  else if (hasPair)  { tier = 2; tieRank = Number(counts[0][0]); }
  else               { tier = 1; tieRank = Math.max(...hand.map(rankValue)); }

  const suitRank = { '♠': 4, '♦': 3, '♣': 2, '♥': 1 };
  const highCard = hand.reduce((best, c) => rankValue(c) > rankValue(best) ? c : best, hand[0]);
  return { tier, tieRank, suitTie: suitRank[highCard.suit] };
}
function compareHands(a, b) {
  if (a.tier !== b.tier) return b.tier - a.tier;
  if (a.tieRank !== b.tieRank) return b.tieRank - a.tieRank;
  return b.suitTie - a.suitTie;
}
const TIER_NAME = { 0:'Empty', 1:'High Card', 2:'Pair', 3:'Trips', 4:'Flush' };

/* ---- Stepped generator: same control flow/order as playRound(), but
   yields one event per resolving Royal so the table can animate it. ---- */
function* playRoundGen(hands, deck, drawIdx) {
  hands.forEach(h => { h._safeHouse = false; });
  const opponentsOf = (i) => hands.map((_, x) => x).filter(x => x !== i);
  const randomOpp = (i) => { const o = opponentsOf(i); return o[Math.floor(Math.random() * o.length)]; };

  // STEP 0 — Tire Iron (J♦), before Kings can act.
  for (let owner = 0; owner < hands.length; owner++) {
    const hand = hands[owner];
    if (findCard(hand, 'J', '♦') !== -1) {
      const t = randomOpp(owner);
      const kingIdx = hands[t].findIndex(c => c.isIron && c.rank === 'K');
      let disabledCard = null;
      if (kingIdx !== -1) { hands[t][kingIdx]._disabled = true; disabledCard = hands[t][kingIdx]; }
      yield { phase: 'tireiron', owner, rank: 'J', suit: '♦', target: t, disabledCard };
    }
  }

  // STEP 1 — Aces.
  for (let owner = 0; owner < hands.length; owner++) {
    if (findCard(hands[owner], 'A', '♥') !== -1) {
      hands[owner]._safeHouse = true;
      yield { phase: 'ace', owner, rank: 'A', suit: '♥' };
    }
  }
  for (let owner = 0; owner < hands.length; owner++) {
    const hand = hands[owner];
    if (findCard(hand, 'A', '♦') !== -1) {
      const extra = draw(deck, drawIdx, 2);
      const pool = hand.concat(extra).sort((a, b) => rankValue(b) - rankValue(a));
      const keepSafeHouse = hand._safeHouse;
      hands[owner] = pool.slice(0, 4);
      hands[owner]._safeHouse = keepSafeHouse;
      yield { phase: 'ace', owner, rank: 'A', suit: '♦' };
    }
  }
  for (let owner = 0; owner < hands.length; owner++) {
    if (findCard(hands[owner], 'A', '♠') !== -1) yield { phase: 'ace', owner, rank: 'A', suit: '♠' };
  }
  for (let owner = 0; owner < hands.length; owner++) {
    if (findCard(hands[owner], 'A', '♣') !== -1) yield { phase: 'ace', owner, rank: 'A', suit: '♣' };
  }

  // STEP 2 — Kings (skip any flagged _disabled by Tire Iron).
  for (let owner = 0; owner < hands.length; owner++) {
    const hand = hands[owner];
    const kIdx = hand.findIndex(c => c.isIron && c.rank === 'K' && !c._disabled);
    if (kIdx === -1) continue;
    const king = hand[kIdx];
    if (king.suit === '♠') {
      if (!king._used) { hand.push(...draw(deck, drawIdx, 1)); king._used = true; }
      yield { phase: 'king', owner, rank: 'K', suit: '♠' };
    } else if (king.suit === '♦') {
      hand.push(...draw(deck, drawIdx, 3));
      hand.sort((a, b) => rankValue(b) - rankValue(a));
      const discarded = hand.splice(hand.length - 2, 2);
      yield { phase: 'king', owner, rank: 'K', suit: '♦', discarded };
    } else if (king.suit === '♣') {
      const t = randomOpp(owner);
      const targetHand = hands[t];
      const fleshIdx = targetHand.findIndex(c => !c.isIron);
      let stolen = null;
      if (fleshIdx !== -1) {
        stolen = targetHand.splice(fleshIdx, 1)[0];
        king._used = true;
        hand.splice(hand.indexOf(king), 1);
      }
      yield { phase: 'king', owner, rank: 'K', suit: '♣', target: t, stolen };
    } else if (king.suit === '♥') {
      hand.push(...draw(deck, drawIdx, 2));
      hand.sort((a, b) => rankValue(b) - rankValue(a));
      const discarded = hand.splice(hand.length - 2, 2);
      yield { phase: 'king', owner, rank: 'K', suit: '♥', discarded };
    }
  }

  // STEP 3 — Queens (Packard Clipper interrupt applies here).
  for (let owner = 0; owner < hands.length; owner++) {
    const hand = hands[owner];
    const qIdx = hand.findIndex(c => c.isIron && c.rank === 'Q');
    if (qIdx === -1) continue;
    const queen = hand[qIdx];
    if (queen.suit === '♠') {
      const t = randomOpp(owner);
      const intercepted = checkSupersede(hands, t, deck, drawIdx);
      const h = hands[t];
      let discarded = null, blocked = false;
      if (h.length) { const idx = weakestIdx(h); discarded = h[idx]; blocked = !safeDiscard(hands, t, idx); }
      yield { phase: 'queen', owner, rank: 'Q', suit: '♠', target: t, discarded, blocked, intercepted };
    } else if (queen.suit === '♦') {
      const targets = [];
      opponentsOf(owner).forEach(o => {
        const intercepted = checkSupersede(hands, o, deck, drawIdx);
        const h = hands[o];
        let discarded = null, blocked = false;
        if (h.length) { const idx = strongestIdx(h); discarded = h[idx]; blocked = !safeDiscard(hands, o, idx); }
        targets.push({ target: o, discarded, blocked, intercepted });
      });
      yield { phase: 'queen', owner, rank: 'Q', suit: '♦', targets };
    } else if (queen.suit === '♣') {
      const targets = [];
      opponentsOf(owner).forEach(o => {
        const intercepted = checkSupersede(hands, o, deck, drawIdx);
        const h = hands[o];
        let discarded = null, blocked = false;
        if (h.length) { const idx = weakestIdx(h); discarded = h[idx]; blocked = !safeDiscard(hands, o, idx); }
        targets.push({ target: o, discarded, blocked, intercepted });
      });
      yield { phase: 'queen', owner, rank: 'Q', suit: '♣', targets };
    } else if (queen.suit === '♥') {
      const t = randomOpp(owner);
      const intercepted = checkSupersede(hands, t, deck, drawIdx);
      const h = hands[t];
      let discarded = null, blocked = false;
      if (h.length) { const idx = strongestIdx(h); discarded = h[idx]; blocked = !safeDiscard(hands, t, idx); }
      yield { phase: 'queen', owner, rank: 'Q', suit: '♥', target: t, discarded, blocked, intercepted };
    }
  }

  // STEP 4 — Jacks (Tire Iron already resolved in Step 0).
  for (let owner = 0; owner < hands.length; owner++) {
    const hand = hands[owner];
    const jIdx = hand.findIndex(c => c.isIron && c.rank === 'J' && c.suit !== '♦');
    if (jIdx === -1) continue;
    const jack = hand[jIdx];
    if (jack.suit === '♠') {
      const t = randomOpp(owner);
      const intercepted = checkSupersede(hands, t, deck, drawIdx);
      const h = hands[t];
      let discarded = null, blocked = false;
      if (h.length) { const idx = weakestIdx(h); discarded = h[idx]; blocked = !safeDiscard(hands, t, idx); }
      yield { phase: 'jack', owner, rank: 'J', suit: '♠', target: t, discarded, blocked, intercepted };
    } else if (jack.suit === '♣') {
      const idx = weakestIdx(hand);
      const swappedOut = hand[idx];
      hand[idx] = draw(deck, drawIdx, 1)[0];
      yield { phase: 'jack', owner, rank: 'J', suit: '♣', swappedOut, swappedIn: hand[idx] };
    } else if (jack.suit === '♥') {
      const t = randomOpp(owner);
      const intercepted = checkSupersede(hands, t, deck, drawIdx);
      const h = hands[t];
      let discarded = null, blocked = false;
      if (h.length) { const idx = strongestIdx(h); discarded = h[idx]; blocked = !safeDiscard(hands, t, idx); }
      yield { phase: 'jack', owner, rank: 'J', suit: '♥', target: t, discarded, blocked, intercepted };
    }
  }

  const evals = hands.map(h => evaluateHand(h));
  let winnerIdx = 0;
  for (let i = 1; i < evals.length; i++) if (compareHands(evals[i], evals[winnerIdx]) < 0) winnerIdx = i;
  return { hands, evals, winnerIdx };
}

/* =====================  PRESENTATION LAYER  ===================== */

const PHASE_LABEL = { tireiron: 'Step 0 — Tire Iron', ace: 'Aces', king: 'Kings', queen: 'Queens', jack: 'Jacks' };

const CAPTIONS = {
  JD: "Tire Iron swings first. Somebody's ride breaks down before they're out the door.",
  AS: "Ledgers cooked, numbers lying pretty as a Sunday hymn.",
  AD: "The cache cracks open. Take what shines, leave what don't.",
  AC: "Wires hum low in the basement. Somebody's secrets just got cheaper.",
  AH: "Doors bolt shut. Nothing leaves this hand tonight.",
  KS: "The Clipper rolls up quiet — room for one more passenger.",
  KD: "Flatbed hauls in heavy, dumps the dead weight on the curb.",
  KC: "The cab pulls the badge trick. One ride, then it's gone for good.",
  KH: "Trawler drags the river — keeps the catch, tosses the trash.",
  QS: "The .38 barks once. Somebody's weak hand hits the floor.",
  QD: "The Thompson sprays the whole table. Strongest cards go down first.",
  QC: "Sawn-off clears the room of anything soft.",
  QH: "The rifle takes its time, then takes the best card in the house.",
  JS: "Switchblade flicks open, quiet and quick. Gone before it's missed.",
  JC: "Brass knuckles trade up — toss the junk, pull something with teeth.",
  JH: "Straight razor's slow and sure. Takes the best card clean."
};

const SUIT_NAME = { '♠':'spade', '♦':'diamond', '♣':'club', '♥':'heart' };
const RANK_NAME = { J:'Jack', Q:'Queen', K:'King', A:'Ace' };

function suitCode(s){ return { '♠':'S', '♦':'D', '♣':'C', '♥':'H' }[s]; }
function rankCode(r){ return typeof r === 'number' ? String(r).padStart(2,'0') : r; }
function cardCode(rank, suit){ return rankCode(rank) + suitCode(suit); }
function cardFile(rank, suit){ return cardCode(rank, suit) + '.webp'; }

const SEAT_LABELS = ['Seat 1','Seat 2','Seat 3','Seat 4'];
const NUM_PLAYERS = 4, HAND_SIZE = 4, WINS_NEEDED = 4;

let hands = [];
let scores = [0,0,0,0];
let animating = false;
let skipRequested = false;
let matchOver = false;

function sleep(ms){
  if (skipRequested) return Promise.resolve();
  return new Promise(res => {
    const id = setTimeout(res, ms);
    const check = setInterval(() => {
      if (skipRequested) { clearTimeout(id); clearInterval(check); res(); }
    }, 30);
    setTimeout(() => clearInterval(check), ms + 40);
  });
}

function cardEl(rank, suit){
  const code = cardCode(rank, suit);
  const div = document.createElement('div');
  div.className = 'card-slot';
  div.dataset.card = code;
  const img = document.createElement('img');
  img.src = cardFile(rank, suit);
  img.alt = code;
  img.onerror = function(){
    div.innerHTML = '';
    const fb = document.createElement('div');
    fb.className = 'card-fallback' + ((suit==='♦'||suit==='♥') ? ' red' : '');
    const isNum = typeof rank === 'number';
    fb.innerHTML = '<div class="r">'+rank+'</div><div class="s">'+suit+'</div>';
    div.appendChild(fb);
  };
  div.appendChild(img);
  return div;
}

function renderHands(){
  for (let i = 0; i < NUM_PLAYERS; i++){
    const row = document.querySelector('[data-hand="'+i+'"]');
    row.innerHTML = '';
    hands[i].forEach(c => {
      const el = cardEl(c.rank, c.suit);
      if (c._disabled) el.classList.add('card-disabled');
      row.appendChild(el);
    });
  }
}

function renderScoreboard(){
  const board = document.getElementById('scoreboard');
  board.innerHTML = '';
  const lead = Math.max(...scores);
  scores.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'score-card' + (s === lead && s > 0 ? ' leader' : '');
    card.innerHTML = '<div class="seat-name">'+SEAT_LABELS[i]+'</div><div class="pips"></div>';
    const pips = card.querySelector('.pips');
    for (let p = 0; p < WINS_NEEDED; p++){
      const pip = document.createElement('div');
      pip.className = 'pip' + (p < s ? ' filled' : '');
      pips.appendChild(pip);
    }
    board.appendChild(card);
  });
}

function buildCheatSheet(){
  const tiers = [
    { title: 'Aces · resolve 1st', rows: [
      ['♠','A','Cooked Ledgers','Flavor only — no effect.'],
      ['♦','A','Dockside Cache','Draw 2, keep best 4.'],
      ['♣','A','Wiretap Relay','Flavor only — no effect.'],
      ['♥','A','Safe House','Hand immune to discards this round.']
    ]},
    { title: 'Kings · resolve 2nd', rows: [
      ['♠','K','Packard Clipper','Draw 1; if unused, intercepts the first incoming Q/J discard.'],
      ['♦','K','Flatbed Truck','Draw 3, discard 2 weakest.'],
      ['♣','K','Patrol Cab','Steal a non-Royal from a random foe, then self-removes.'],
      ['♥','K','River Trawler','Draw 2, discard 2 weakest.']
    ]},
    { title: 'Queens · resolve 3rd', rows: [
      ['♠','Q','.38 Revolver','Random foe discards weakest.'],
      ['♦','Q','Thompson SMG','Every foe discards strongest.'],
      ['♣','Q','Sawn-Off Shotgun','Every foe discards weakest.'],
      ['♥','Q','Bolt-Action Rifle','Random foe discards strongest.']
    ]},
    { title: 'Jacks · resolve last', rows: [
      ['♦','J','Tire Iron','Step 0 — disables a random foe\'s King for the round.'],
      ['♠','J','Switchblade','Random foe discards weakest.'],
      ['♣','J','Brass Knuckles','Swap your own weakest card for a fresh draw.'],
      ['♥','J','Straight Razor','Random foe discards strongest.']
    ]}
  ];
  const body = document.getElementById('cheat-body');
  body.innerHTML = '';
  tiers.forEach(tier => {
    const block = document.createElement('div');
    block.className = 'tier-block';
    block.innerHTML = '<div class="tier-title">'+tier.title+'</div>';
    tier.rows.forEach(([suit, rank, name, desc]) => {
      const code = cardCode(rank, suit);
      const row = document.createElement('div');
      row.className = 'cheat-row ' + SUIT_NAME[suit];
      row.dataset.card = code;
      row.innerHTML = '<div class="suit-mark">'+suit+'</div><div class="body"><b>'+name+'</b><br>'+desc+'</div>';
      block.appendChild(row);
    });
    body.appendChild(block);
  });
}

function highlightCheat(code, on){
  const row = document.querySelector('.cheat-row[data-card="'+code+'"]');
  if (row) row.classList.toggle('active', on);
}

function findSlot(owner, rank, suit){
  const row = document.querySelector('[data-hand="'+owner+'"]');
  if (!row) return null;
  return row.querySelector('[data-card="'+cardCode(rank, suit)+'"]');
}

async function showCaption(code, phase, fallbackText){
  const bar = document.getElementById('caption-bar');
  const eyebrow = document.getElementById('caption-eyebrow');
  const line = document.getElementById('caption-line');
  eyebrow.textContent = PHASE_LABEL[phase] || '';
  line.textContent = CAPTIONS[code] || fallbackText || '';
  bar.classList.add('show');
  highlightCheat(code, true);
  await sleep(skipRequested ? 60 : 900);
  bar.classList.remove('show');
  highlightCheat(code, false);
  await sleep(skipRequested ? 0 : 180);
}

async function animateEvent(ev){
  const code = cardCode(ev.rank, ev.suit);
  const actorSlot = findSlot(ev.owner, ev.rank, ev.suit);
  if (actorSlot) actorSlot.classList.add('glow-intense');

  if (ev.disabledCard){
    const s = findSlot(ev.target, ev.disabledCard.rank, ev.disabledCard.suit);
    if (s) s.classList.add('card-disabled');
  }
  const flashOne = (targetOwner, discarded, blocked) => {
    if (!discarded) return;
    const s = findSlot(targetOwner, discarded.rank, discarded.suit);
    if (!s) return;
    s.classList.add(blocked ? 'card-blocked' : 'card-flash-red');
  };
  if (ev.discarded !== undefined) flashOne(ev.target, ev.discarded, ev.blocked);
  if (ev.targets) ev.targets.forEach(t => flashOne(t.target, t.discarded, t.blocked));
  if (ev.stolen){
    const s = findSlot(ev.target, ev.stolen.rank, ev.stolen.suit);
    if (s) s.classList.add('card-flash-red');
  }
  if (ev.swappedOut){
    const s = findSlot(ev.owner, ev.swappedOut.rank, ev.swappedOut.suit);
    if (s) s.classList.add('card-flash-red');
  }

  await showCaption(code, ev.phase);
  renderHands(); // sync DOM to post-mutation state
}

function setSkippable(on){
  document.getElementById('table-wrap').classList.toggle('skippable', on);
  document.getElementById('skip-hint').hidden = !on;
}

function onTableClick(){
  if (animating) skipRequested = true;
}

async function playRound(){
  if (animating || matchOver) return;
  animating = true;
  skipRequested = false;
  document.getElementById('play-btn').disabled = true;
  setSkippable(true);

  const deck = shuffle(buildDeck());
  hands = dealHands(deck, NUM_PLAYERS, HAND_SIZE);
  const drawIdx = { i: NUM_PLAYERS * HAND_SIZE };
  document.querySelectorAll('.seat').forEach(s => s.classList.remove('winning'));
  renderHands();

  const gen = playRoundGen(hands, deck, drawIdx);
  let step = gen.next();
  while (!step.done){
    await animateEvent(step.value);
    step = gen.next();
  }
  const result = step.value;
  hands = result.hands;
  renderHands();

  setSkippable(false);
  scores[result.winnerIdx]++;
  renderScoreboard();

  const tierName = TIER_NAME[result.evals[result.winnerIdx].tier];
  document.querySelector('[data-seat="'+result.winnerIdx+'"]').classList.add('winning');
  document.getElementById('caption-eyebrow').textContent = 'Round result';
  document.getElementById('caption-line').textContent =
    SEAT_LABELS[result.winnerIdx] + ' takes the round — ' + tierName + '.';
  document.getElementById('caption-bar').classList.add('show');

  animating = false;

  if (scores[result.winnerIdx] >= WINS_NEEDED){
    matchOver = true;
    document.getElementById('banner-title').textContent = SEAT_LABELS[result.winnerIdx] + ' WINS THE MATCH';
    document.getElementById('winner-banner').hidden = false;
  } else {
    document.getElementById('play-btn').disabled = false;
    document.getElementById('play-btn').textContent = 'Next Round';
  }
}

function newMatch(){
  scores = [0,0,0,0];
  matchOver = false;
  hands = hands.map(() => []);
  renderHands();
  renderScoreboard();
  document.querySelectorAll('.seat').forEach(s => s.classList.remove('winning'));
  document.getElementById('winner-banner').hidden = true;
  document.getElementById('play-btn').textContent = 'Deal Round';
  document.getElementById('play-btn').disabled = false;
  document.getElementById('caption-bar').classList.remove('show');
  document.getElementById('caption-line').textContent = 'Deal the round to begin.';
  document.getElementById('caption-eyebrow').textContent = '\u00A0';
}

document.getElementById('play-btn').addEventListener('click', playRound);
document.getElementById('new-match-btn').addEventListener('click', newMatch);
document.getElementById('table-wrap').addEventListener('click', onTableClick);
document.getElementById('cheat-toggle').addEventListener('click', () => {
  const panel = document.getElementById('cheat-panel');
  panel.classList.toggle('collapsed');
  document.getElementById('cheat-arrow').textContent = panel.classList.contains('collapsed') ? '\u25B2' : '\u25BC';
});

// init
hands = [[],[],[],[]];
buildCheatSheet();
renderHands();
renderScoreboard();
</script>
