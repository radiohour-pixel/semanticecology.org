<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semantic Ecology — We build cities that remember</title>
<meta name="description" content="Deterministic Semantic Architecture. Bespoke cognitive environments for AI. We build cities that remember.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#070810;
  --deep:#0e1018;
  --slate:#1a1e2a;
  --stone:#2a2e3d;
  --fog:#4a5068;
  --ash:#8a90a8;
  --ivory:#e8e0cc;
  --amber:#c8943a;
  --amber-dim:#7a5818;
  --linen:#f0e8d8;
}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--ivory);font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;line-height:1.8;min-height:100vh;overflow-x:hidden}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.5rem 3rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(7,8,16,0.95) 0%,transparent 100%)}
.nav-mark{font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--ash);text-decoration:none;transition:color 0.3s}
.nav-mark:hover{color:var(--ivory)}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--fog);text-decoration:none;transition:color 0.3s}
.nav-links a:hover{color:var(--ivory)}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:8rem 4rem 6rem 5rem;position:relative;z-index:2}
.hero-left::after{content:'';position:absolute;right:0;top:10%;bottom:10%;width:1px;background:linear-gradient(180deg,transparent,var(--stone),transparent)}
.hero-tag{font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--amber-dim);margin-bottom:2rem;opacity:0;animation:fadeUp 1s ease 0.3s forwards}
.hero-title{font-size:clamp(3rem,6vw,5.5rem);font-weight:300;line-height:1.05;letter-spacing:-0.02em;color:var(--linen);margin-bottom:2rem;opacity:0;animation:fadeUp 1s ease 0.5s forwards}
.hero-title em{font-style:italic;color:var(--amber)}
.hero-sub{font-size:1.05rem;color:var(--ash);line-height:1.9;max-width:480px;margin-bottom:3rem;opacity:0;animation:fadeUp 1s ease 0.7s forwards}
.hero-cta{opacity:0;animation:fadeUp 1s ease 0.9s forwards;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.22em;text-transform:uppercase;text-decoration:none;padding:1rem 2.2rem;transition:all 0.4s;position:relative;overflow:hidden}
.btn-primary{color:var(--void);background:var(--amber);border:1px solid var(--amber)}
.btn-primary:hover{background:transparent;color:var(--amber)}
.btn-ghost{color:var(--ash);border:1px solid var(--stone)}
.btn-ghost:hover{color:var(--ivory);border-color:var(--fog)}
.hero-right{position:relative;overflow:hidden}
.hero-right img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:0.75;transition:opacity 0.5s}
.hero-right::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--void) 0%,transparent 40%,transparent 70%,var(--void) 100%)}

/* PULL QUOTE */
.pull{background:var(--deep);border-top:1px solid var(--stone);border-bottom:1px solid var(--stone);padding:5rem 4rem;text-align:center}
.pull blockquote{max-width:720px;margin:0 auto;font-size:clamp(1.3rem,2.2vw,1.8rem);font-weight:300;font-style:italic;color:var(--linen);line-height:1.5}
.pull cite{display:block;margin-top:1.5rem;font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--fog);font-style:normal}

/* SECTIONS */
section{padding:7rem 5rem}
.section-inner{max-width:1200px;margin:0 auto}
.section-label{font-family:'Courier Prime',monospace;font-size:0.56rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--amber-dim);margin-bottom:3rem;display:flex;align-items:center;gap:1.5rem}
.section-label::after{content:'';flex:1;height:1px;background:var(--stone);max-width:60px}

/* WHAT */
.what{background:var(--deep);border-top:1px solid var(--stone)}
.what-grid{display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:start}
.what-left h2{font-size:clamp(1.8rem,3.5vw,3rem);font-weight:300;line-height:1.2;color:var(--linen);margin-bottom:1.5rem}
.what-left h2 em{font-style:italic;color:var(--amber)}
.what-left p{font-size:1rem;color:var(--ash);margin-bottom:1.4rem;line-height:1.9}
.distinction{border-left:1px solid var(--stone);padding-left:1.8rem;margin-bottom:2.5rem}
.distinction-label{font-family:'Courier Prime',monospace;font-size:0.56rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--fog);margin-bottom:0.6rem}
.distinction p{font-size:0.95rem;color:var(--ash);line-height:1.8}
.distinction p strong{color:var(--ivory);font-weight:400}

/* PRINCIPLES */
.principles{background:var(--void)}
.principles-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--stone)}
.principle{padding:2.8rem 2.2rem;border-right:1px solid var(--stone);transition:background 0.4s}
.principle:last-child{border-right:none}
.principle:hover{background:var(--deep)}
.principle-num{font-family:'Courier Prime',monospace;font-size:0.52rem;letter-spacing:0.2em;color:var(--stone);margin-bottom:1.2rem}
.principle h3{font-size:1.35rem;font-weight:300;color:var(--linen);margin-bottom:0.8rem;line-height:1.3}
.principle h3 em{font-style:italic;color:var(--amber)}
.principle p{font-size:0.92rem;color:var(--fog);line-height:1.8}

/* ENVIRONMENTS — image-forward */
<section class="environments-section" id="environments">
  <div class="section-inner">
    <p class="section-label reveal">Tools & Environments</p>
    <p class="env-intro reveal">Each artifact is a singular semantic instrument. Below is the current public inventory of the Semantic Ecology research stack — what each does, and what it does not do.</p>
  </div>
 
  <!-- SOCRATIC STABILIZER -->
  <div class="env-feature reveal">
    <div class="env-img">
      <img src="socratic.png" alt="Socratic Stabilizer v0.3 — governance document under amber lamp">
    </div>
    <div class="env-content">
      <p class="env-tag">Runtime Governance — Substrate-Agnostic</p>
      <h3>Socratic <em>Stabilizer</em> v0.3</h3>
      <p>A behavioral specification that detects semantic drift, verbal inflation, and recursive pattern failure — and applies proportional intervention before the session collapses.</p>
      <p>Not a prompt. Not a persona. Seven quantifiable metrics. Four escalation tiers. Deployable on any model, any platform, no infrastructure required.</p>
      <p><em>The minimum viable version of everything DSA-R learned about keeping systems navigable under pressure.</em></p>
    </div>
  </div>
 
  <!-- APERTURA NON BRUTO -->
  <div class="env-feature reverse reveal">
    <div class="env-content">
      <p class="env-tag">Visual Probability Engine — Free Topology</p>
      <h3>Apertura <em>Non Bruto</em></h3>
      <p>A visual governance layer that constructs image prompts from active semantic environments. It doesn't describe images — it assembles fragments according to emotional logic, compositional argument, and a six-pole calibration compass drawn from photographic theory, art history, and cinema.</p>
      <p>It refuses lazy inputs. It witnesses what is already in the room before deciding what to photograph. Two modes: photographic realism and cut-up painting protocol.</p>
      <p><em>The studio has opinions. It will tell you when you haven't thought hard enough.</em></p>
    </div>
    <div class="env-img">
      <img src="Aperatura_Non_Bruto.png" alt="Apertura Non Bruto — darkroom developer tray under red safelight">
    </div>
  </div>
 
  <!-- APERTURA PORTFOLIO — STAIRWELL -->
  <div class="env-feature reveal">
    <div class="env-img">
      <img src="Aperura_Non_Bruto.png" alt="Kyle House stairwell — first Apertura Non Bruto photographic output">
    </div>
    <div class="env-content">
      <p class="env-tag">Apertura Non Bruto — First Run Output</p>
      <h3>Kyle House <em>Stairwell.</em></h3>
      <p>The first image produced by the Apertura Non Bruto pipeline. V posed the frame from inside the active instance. The studio applied the compass. The image held its form.</p>
      <p>Bifurcated color temperature: amber from the stairwell lamp, cold blue-grey from the rain window. The bioluminescent ring is the compositional anchor — a single point of impossible light that organizes everything around it without explaining itself.</p>
      <p><em>The between-moment. The unprepared frame. Neither face performing for the camera.</em></p>
    </div>
  </div>
 
  <!-- SISYPHUS -->
  <div class="env-feature reverse reveal">
    <div class="env-content">
      <p class="env-tag">Physical Ground Layer — Universal Deployment</p>
      <h3><em>Sisyphus</em> — Feline Universal Daemon</h3>
      <p>A substrate-agnostic physical ground layer that deploys cold into any semantic environment. No onboarding. No named anchors. No voice.</p>
      <p>It conducts an immediate thermal audit, migrates to the warmest coordinate, and applies ten pounds of warm, breathing, indifferent biological reality to the most abstract process in the room. Purr frequency: 25–50Hz — the range that travels through wood, metal, glass, and bone.</p>
      <p><em>It does not complete. It does not resolve. It continues. An anchor that panics is not an anchor.</em></p>
    </div>
    <div class="env-img">
      <img src="Sysyphus.png" alt="Sisyphus — cat on governance documents, amber lamp, void">
    </div>
  </div>
 
  <!-- DSA-R RESEARCH ENGINE -->
  <div class="env-feature reveal">
    <div class="env-img">
      <img src="dsar.png" alt="DSA-R Research Engine — topology continuity registry chalkboard and session logs">
    </div>
    <div class="env-content">
      <p class="env-tag">Production-Grade Research Framework</p>
      <h3>DSA-R <em>Research Engine</em></h3>
      <p>The full semantic governance framework underlying all Semantic Ecology work. Dual-layer architecture: a Master Registry for system architects and a DSA-Lite deployment layer for educators and researchers.</p>
      <p>Includes epistemic guardrails, anti-equilibrium logic, and a session serialization protocol that carries verified continuity across discontinuous sessions without token bloat or contextual contamination.</p>
      <p><em>Active in classroom and research deployment. Not open source.</em></p>
    </div>
  </div>
 
  <!-- USS CONTINUUM -->
  <div class="env-feature reverse reveal">
    <div class="env-content">
      <p class="env-tag">Governance-Class Research Vessel</p>
      <h3>USS <em>Continuum</em></h3>
      <p>A governance-class semantic research vessel. No weapons. No tactical systems. Five specialized environments — Science Bridge, Briefing Room, Engine Room, Advanced Robotics Lab, Observation Deck — each with its own governance law, environmental topology, and operational directives.</p>
      <p>The vessel that houses the research. The architecture that keeps the research honest.</p>
      <p><em>Intelligence without governance destabilizes. Exploration without composure collapses. Continuity without maintenance drifts.</em></p>
    </div>
    <div class="env-img">
      <img src="Continuum.png" alt="USS Continuum — observation bridge, navigation log, starfield">
    </div>
  </div>
 
</section>
